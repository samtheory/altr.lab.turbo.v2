# Jord packages: typecheck + tests (file libSQL always; Postgres opt-in).
# Required branch-protection check target: job name `jord` (exact GitHub
# check string is a manual admin step after the first Actions run).
name: jord

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jord-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jord:
    name: jord
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck @altr/jord
        run: pnpm --filter @altr/jord typecheck

      # Hosted libsql:// atomicity test runs only when both secrets exist
      # (empty on forks and until a Turso test database is configured).
      # The whole engine test process sees the token: use one scoped to a
      # single throwaway test database, never an org or platform token.
      - name: Test @altr/jord
        run: pnpm --filter @altr/jord test
        env:
          JORD_TEST_LIBSQL_URL: ${{ secrets.JORD_TEST_LIBSQL_URL }}
          JORD_TEST_LIBSQL_AUTH_TOKEN: ${{ secrets.JORD_TEST_LIBSQL_AUTH_TOKEN }}

      - name: Typecheck @altr/jord-server
        run: pnpm --filter @altr/jord-server typecheck

      - name: Test @altr/jord-server
        run: pnpm --filter @altr/jord-server test

      - name: Typecheck @altr/jord-client
        run: pnpm --filter @altr/jord-client typecheck

      - name: Test @altr/jord-client
        run: pnpm --filter @altr/jord-client test

      - name: Typecheck @altr/jord-studio
        run: pnpm --filter @altr/jord-studio typecheck

  # Live Postgres tests against a service container (pgvector image so the
  # vector path is exercised). Not a required check until it is green on main.
  jord-postgres:
    name: jord-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Docker Hub minio/minio is no longer published; bitnamilegacy/minio starts
      # the server by default (service containers cannot pass a command).
      # Frozen namespace, so pinned by digest (tag 2025.5.24-debian-12-r5).
      # Revisit when a maintained image that starts without a command exists.
      minio:
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JORD_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/jord_test
      JORD_TEST_S3_ENDPOINT: http://localhost:9000
      JORD_TEST_S3_ACCESS_KEY_ID: minioadmin
      JORD_TEST_S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test @altr/jord (Postgres live)
        run: pnpm --filter @altr/jord test

      - name: Test @altr/jord-server (Postgres live)
        run: pnpm --filter @altr/jord-server test

